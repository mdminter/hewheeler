<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wheeler Wrecker | Live Dispatch</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
:root {
  --gold:#d4af37;
  --bg:#050505;
}

body {
  margin:0;
  font-family:Inter;
  background:var(--bg);
  color:white;
}

/* HERO */
.hero {
  height:100vh;
  background:
    radial-gradient(circle at top, rgba(212,175,55,.15), transparent),
    url('towtruck.jpg') center/cover;
  display:flex;
  align-items:center;
  padding:40px;
}

.hero h1 {
  font-family:Orbitron;
  font-size:3rem;
  color:var(--gold);
}

/* GLASS CARD */
.glass {
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border:1px solid rgba(212,175,55,.3);
  padding:25px;
  border-radius:15px;
}

/* DISPATCH FORM */
form input, select, textarea {
  width:100%;
  padding:12px;
  margin:8px 0;
  background:#000;
  border:1px solid #333;
  color:white;
}

button {
  background:linear-gradient(45deg,var(--gold),#ffcc00);
  border:none;
  padding:15px;
  width:100%;
  font-weight:bold;
  cursor:pointer;
}

/* LIVE STATUS */
.status {
  margin-top:20px;
  font-size:0.9rem;
  color:#aaa;
}

</style>
</head>

<body>

<section class="hero">

<div class="glass" style="max-width:500px">

<h1>REQUEST DISPATCH</h1>

<form id="dispatchForm">

<input id="name" placeholder="Full Name" required>
<input id="phone" placeholder="Phone Number" required>

<input id="location" placeholder="Vehicle Location" required>
<button type="button" onclick="getLocation()">📍 Use My Location</button>

<select id="service">
<option>Light Duty Tow</option>
<option>Heavy Duty Tow</option>
<option>Roadside</option>
<option>Recovery</option>
</select>

<textarea id="notes" placeholder="Describe situation"></textarea>

<button type="submit">DISPATCH NOW</button>

</form>

<div class="status" id="status"></div>

</div>

</section>

<script>

function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById("location").value =
      pos.coords.latitude + "," + pos.coords.longitude;
  });
}

document.getElementById("dispatchForm").addEventListener("submit", async e=>{
  e.preventDefault();

  const data = {
    name: name.value,
    phone: phone.value,
    location: location.value,
    service: service.value,
    notes: notes.value
  };

  document.getElementById("status").innerText="Sending request...";

  const res = await fetch("http://localhost:3000/api/dispatch", {
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  });

  document.getElementById("status").innerText="Driver being assigned...";
});

</script>

</body>
</html>
